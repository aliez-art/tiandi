[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/tiandi"
rust-version = "1.97"

[workspace.dependencies]
# M0 基础依赖（v1.1 架构定稿后按里程碑引入）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util", "io-std"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sysinfo = "0.33"
webbrowser = "1.0"
tempfile = "3"

# M1 数据管线与丹方
image = "0.25"
rayon = "1.10"
walkdir = "2.5"
kamadak-exif = "0.6"
toml = "0.8"
